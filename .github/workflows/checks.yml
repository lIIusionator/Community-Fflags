name: Security & Validation Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-json:
    runs-on: ubuntu-latest
    name: Validate JSON Files
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate JSON formatting
        run: |
          echo "Validating JSON files..."
          find . -name "*.json" -type f | while read file; do
            if ! python3 -m json.tool "$file" > /dev/null 2>&1; then
              echo "❌ Invalid JSON in $file"
              exit 1
            fi
            echo "✓ Valid: $file"
          done
          echo "✅ All JSON files are valid"

  validate-config:
    runs-on: ubuntu-latest
    name: Validate Configuration Files
    steps:
      - uses: actions/checkout@v4
      
      - name: Check place-id.ini files
        run: |
          echo "Validating place-id.ini files..."
          find . -name "place-id.ini" -type f | while read file; do
            content=$(cat "$file" | tr -d ' \n' | tr -d '\t')
            if ! [[ "$content" =~ ^[0-9]+$ ]]; then
              echo "❌ Invalid place ID in $file (must contain only a number)"
              exit 1
            fi
            echo "✓ Valid: $file (Place ID: $content)"
          done
          echo "✅ All configuration files are valid"

  security-scan:
    runs-on: ubuntu-latest
    name: Security Scan
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy security scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  check-structure:
    runs-on: ubuntu-latest
    name: Check Repository Structure
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate repository structure
        run: |
          echo "Checking repository structure..."
          
          # Check for README
          if [ ! -f "README.md" ]; then
            echo "❌ README.md is missing"
            exit 1
          fi
          echo "✓ README.md exists"
          
          # Check each game folder has place-id.ini
          find . -maxdepth 1 -type d ! -name "." ! -name ".." ! -name ".git" ! -name ".github" | while read dir; do
            if [ -f "$dir/place-id.ini" ] || [ "$dir" = "./general" ]; then
              echo "✓ Valid game folder: $dir"
            else
              echo "⚠ Game folder without place-id.ini: $dir"
            fi
          done
          
          echo "✅ Repository structure looks good"

  summary:
    runs-on: ubuntu-latest
    name: Check Summary
    needs: [validate-json, validate-config, security-scan, check-structure]
    if: always()
    steps:
      - name: All checks passed
        if: ${{ needs.validate-json.result == 'success' && needs.validate-config.result == 'success' && needs.security-scan.result == 'success' && needs.check-structure.result == 'success' }}
        run: echo "✅ All checks passed!"
      
      - name: Some checks failed
        if: ${{ failure() }}
        run: exit 1
